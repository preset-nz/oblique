# `just docs`: the node pages in docs/nodes/. Its own crate, outside the src-tauri package and
# not a workspace member, so the app builds and tests without preset-docs (family requirement
# "preset-docs comes from crates.io and stays out of the app's build graph", 2026-10-20). Nothing in src-tauri names this crate.
[package]
name = "oblique-docs"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# The registry and the sidecar catalogue, without a window.
oblique = { path = "../../src-tauri" }
rhizome-core = "0.1.6"
rhizome-pom = "0.1.6"
preset-docs = { version = "0.1", features = ["rhizome"] }


# The app (`oblique`, by path above) takes preset-app-kit from the packages checkout for its
# unreleased `models` feature; this crate is its own workspace root, so it needs the same patch
# (src-tauri/Cargo.toml). Goes with that one.
[patch.crates-io]
preset-app-kit = { path = "../../../../packages/app-kit" }
