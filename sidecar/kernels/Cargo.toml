[package]
name = "oblique-kernels"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native (PyO3) kernels for hot per-pixel loops in the Oblique sidecar."
publish = false

[lib]
name = "oblique_kernels"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py312"] }
numpy = "0.29.0"
rayon = "1.12.0"

# Byte-identity with the NumPy reference (architecture decision 11a) depends
# on plain IEEE float32 arithmetic — no fast-math, no FMA contraction.
[profile.release]
opt-level = 3
codegen-units = 1
