[project]
name = "sidecar"
version = "0.1.0"
description = "Image-operator sidecar — NumPy/Pillow ops over a framed stdio protocol."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.5.0",
    "pillow>=13.0.0",
    "onnxruntime==1.23.2",
    "oblique-kernels",
]

[dependency-groups]
build = ["pyinstaller>=6.21.0"]
test = ["pytest>=8.3.0"]
lint = ["ruff>=0.15.20"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
oblique-kernels = { path = "kernels" }

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "perf: perf smoke tests, wall-clock sensitive — skipped by default (deselect via -m 'not perf').",
]
addopts = "-m 'not perf'"
