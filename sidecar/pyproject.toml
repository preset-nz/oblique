[project]
name = "sidecar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "perf: perf smoke tests, wall-clock sensitive — skipped by default (deselect via -m 'not perf').",
]
addopts = "-m 'not perf'"
