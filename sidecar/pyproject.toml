[project]
name = "sidecar"
version = "0.1.0"
description = "Image-operator sidecar — NumPy/Pillow ops over a framed stdio protocol."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.5.0",
    "pillow>=12.3.0",
    "onnxruntime==1.23.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=8.3.0",
    "pyinstaller>=6.21.0",
    "pip-licenses>=5.5.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "perf: perf smoke tests, wall-clock sensitive — skipped by default (deselect via -m 'not perf').",
]
addopts = "-m 'not perf'"
