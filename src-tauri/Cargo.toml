[package]
name = "oblique"
version = "0.2.1"
description = "An image editor for making things worse — beautifully."
authors = ["preset.nz"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oblique_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
fontdb = "0.24"
ttf-parser = "0.25"

rustybuzz = "0.20"
# The document lives in rhizome (Epic 21). The [patch.crates-io] below points it at the sibling
# checkout in packages/ until the next publish (family rule: path dependencies are allowed,
# 2026-10-12); the patch wins over these versions.
rhizome-core = "0.1.6"
rhizome-pom = "0.1.6"
rhizome-pom-tauri = "0.1.6"
# The family's app behaviour (Epic 22): Undo/Redo titles, File commands, the close guard. Slice a
# implements its History and Document on the document host; the menu and install come after.
# By path until the next release (family requirements, 2026-10-12): 0.1.3's fresh Untitled at
# launch. A clean clone needs ../packages/app-kit beside initiatives/.
preset-app-kit = "0.1.3"

[dev-dependencies]
# A mock app, so the host's emitted events can be heard in tests.
tauri = { version = "2", features = ["test"] }
# Golden-render test rasteriser only (text/raster_tests.rs); nothing ships. BSD-3-Clause.
tiny-skia = "0.11"

