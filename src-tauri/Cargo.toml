[package]
name = "oblique"
version = "0.2.0-alpha"
description = "An image editor for making things worse — beautifully."
authors = ["preset.nz"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oblique_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
fontdb = "0.24"
ttf-parser = "0.25"

rustybuzz = "0.20"
# The document lives in rhizome (Epic 21). Private repo, tagged; try a local change with a
# temporary [patch."ssh://git@github.com/preset-nz/rhizome.git"], never committed.
rhizome-core = { git = "ssh://git@github.com/preset-nz/rhizome.git", tag = "v0.1.3" }
rhizome-pom = { git = "ssh://git@github.com/preset-nz/rhizome.git", tag = "v0.1.3" }
rhizome-pom-tauri = { git = "ssh://git@github.com/preset-nz/rhizome.git", tag = "v0.1.3" }

[dev-dependencies]
# Golden-render test rasteriser only (text/raster_tests.rs); nothing ships. BSD-3-Clause.
tiny-skia = "0.11"
