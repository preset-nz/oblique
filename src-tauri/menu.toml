# app-kit's built-in menu items (Epic 22, slice c). File's New, Open…, Open Recent, Close,
# Save, Save As… and Revert to Saved… are all on, app-kit's, against the document host;
# Settings… is on too. Labels, chords and places are the menu standard's.
[file]
new = true
open = true
open_recent = true
close = true
save = true
save_as = true
revert = true

[app]
settings = true
